# In-place Rust port of the HP2 engine. Every crate here replaces a C++
# subsystem inside the shipping hp2_game; hp2-ffi is the single staticlib the
# CMake build links (see Build/CMake/HP2Targets.cmake).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
hp2-ffi-support = { path = "crates/hp2-ffi-support" }
hp2-ini = { path = "crates/hp2-ini" }
hp2-codecs = { path = "crates/hp2-codecs" }
hp2-import = { path = "crates/hp2-import" }
caseless = "=0.2.2"
sha2 = "=0.10.9"
cbindgen = { version = "=0.29.4", default-features = false }
log = "=0.4.34"
parking_lot = "=0.12.5"
libc = "=0.2.190"
lewton = "=0.10.2"
