[workspace]
resolver = "2"
members = [
    "crates/hp-format",
    "crates/hp-ini",
    "crates/hp-uobject",
    "crates/hp-engine",
    "crates/hp-render",
    "crates/hp-audio",
    "crates/hp-app",
    "crates/hp2rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
# Internal crates (path deps, one version for the whole workspace).
hp-format = { path = "crates/hp-format" }
hp-ini = { path = "crates/hp-ini" }
hp-uobject = { path = "crates/hp-uobject" }
hp-engine = { path = "crates/hp-engine" }
hp-render = { path = "crates/hp-render" }
hp-audio = { path = "crates/hp-audio" }
hp-app = { path = "crates/hp-app" }

# External dependencies. Exact pins per the rewrite plan's version policy:
# upgrades are separate evidenced sessions, one dependency family at a time.
# Pins recorded 2026-08-24 against crates.io max_stable_version.
wgpu = "=30.0.1"
winit = "=0.30.13"
rodio = "=0.22.2"
symphonia = { version = "=0.6.1", features = ["ogg"] }
egui = "=0.36.1"
egui-winit = "=0.36.1"
egui-wgpu = "=0.36.1"
rfd = "=0.17.2"
rand_chacha = "=0.10.0"
sha2 = "=0.11.0"
png = "=0.18.1"
image = "=0.25.10"

[profile.release]
debug = true
