# In-place Rust port of the HP2 engine. Every crate here replaces a C++
# subsystem inside the shipping hp2_game; hp2-ffi is the single staticlib the
# CMake build links (see Build/CMake/HP2Targets.cmake).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
hp2-ffi-support = { path = "crates/hp2-ffi-support" }
hp2-ini = { path = "crates/hp2-ini" }
hp2-codecs = { path = "crates/hp2-codecs" }
hp2-import = { path = "crates/hp2-import" }
hp2-launcher = { path = "crates/hp2-launcher" }
hp2-audio = { path = "crates/hp2-audio" }
hp2-platform = { path = "crates/hp2-platform" }
hp2-abi = { path = "crates/hp2-abi" }
hp2-wgpu = { path = "crates/hp2-wgpu" }
hp2-fire = { path = "crates/hp2-fire" }
wgpu = "=30.0.1"
glam = { version = "=0.34.1", features = ["bytemuck"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
naga = "=30.0.1"
pollster = "=1.0.1"
raw-window-handle = "=0.6.2"
sha2 = "=0.10.9"
cbindgen = { version = "=0.29.4", default-features = false }
log = "=0.4.34"
parking_lot = "=0.12.5"
libc = "=0.2.190"
lewton = "=0.10.2"
png = "=0.18.1"
