name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The macOS preset requires a native Apple silicon host. Linux has
    # separate arm64 and x64 jobs below.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Rust workspace tests
        env:
          HP2_ARTIFACT_DIR: ${{ github.workspace }}/out/macos-arm64/Testing/HP2/workspace_cargo/Artifacts
        run: |
          set -euo pipefail
          mkdir -p "$HP2_ARTIFACT_DIR"/{Home,Tmp,Config,Cache,Data}
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$HP2_ARTIFACT_DIR/Home" TMPDIR="$HP2_ARTIFACT_DIR/Tmp"
          export XDG_CONFIG_HOME="$HP2_ARTIFACT_DIR/Config"
          export XDG_CACHE_HOME="$HP2_ARTIFACT_DIR/Cache"
          export XDG_DATA_HOME="$HP2_ARTIFACT_DIR/Data"
          export LC_ALL=C TZ=UTC HP2_TEST_NAME=workspace_cargo
          exec > >(tee "$HP2_ARTIFACT_DIR/workspace.log") 2>&1
          cargo test --locked --workspace

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust clippy (renderer-wgpu feature)
        # hp2-engine owns renderer-wgpu. Type-checking does not establish
        # native SDK linkage or actual presentation behavior.
        run: cargo clippy --locked -p hp2-engine --features renderer-wgpu --all-targets -- -D warnings

      - name: Configure
        run: cmake --preset macos-arm64 -DHP2_SHARED_TEST_CARGO_CACHE=ON

      - name: Agent and required-test contracts
        env:
          HP2_ARTIFACT_DIR: ${{ github.workspace }}/out/macos-arm64/Testing/HP2/agent_ci/Artifacts
        run: |
          set -euo pipefail
          mkdir -p "$HP2_ARTIFACT_DIR"
          ctest --preset macos-arm64 --show-only=json-v1 > "$HP2_ARTIFACT_DIR/ctest.json"
          python3 -B Build/check_agent_contracts.py \
            --ctest-json "$HP2_ARTIFACT_DIR/ctest.json" \
            --require-test agent_contracts \
            --require-test agent_navigation_contracts \
            --require-test native_free_game \
            --require-test native_free_ucc \
            --require-test native_free_import \
            --require-test cargo_test_cache_contracts \
            --require-test fractal_ice_alias_contracts \
            --require-test file_hash_contracts \
            --require-label data-none

      - name: Build
        run: cmake --build --preset macos-arm64

      # A fresh GitHub checkout has no game data — the data directories are
      # gitignored — so the data-backed contracts are not registered at
      # configure time (see HP2_TEST_DATA_PRESENT in HP2Targets.cmake). What
      # runs here is the data-none selection: the pure logic, codec, config,
      # launcher, and save contracts.
      #
      # This is a documented data-profile scope, NOT the full suite. The
      # renderer smoke, map sweep, and data-backed contracts are a
      # configuration gap on this runner, not skips. See
      # Docs/BEHAVIOR_MATRIX.md for what each data profile covers.
      - name: Test (data-none profile)
        run: ctest --preset macos-arm64 --no-tests=error -L data-none --output-on-failure

      - name: Verify bundle
        run: python3 Build/check_bundle.py

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust workspace tests
        env:
          HP2_ARTIFACT_DIR: ${{ github.workspace }}/out/linux-x64/Testing/HP2/workspace_cargo/Artifacts
        run: |
          set -euo pipefail
          mkdir -p "$HP2_ARTIFACT_DIR"/{Home,Tmp,Config,Cache,Data}
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$HP2_ARTIFACT_DIR/Home" TMPDIR="$HP2_ARTIFACT_DIR/Tmp"
          export XDG_CONFIG_HOME="$HP2_ARTIFACT_DIR/Config"
          export XDG_CACHE_HOME="$HP2_ARTIFACT_DIR/Cache"
          export XDG_DATA_HOME="$HP2_ARTIFACT_DIR/Data"
          export LC_ALL=C TZ=UTC HP2_TEST_NAME=workspace_cargo
          exec > >(tee "$HP2_ARTIFACT_DIR/workspace.log") 2>&1
          cargo test --locked --workspace

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust clippy (renderer-wgpu feature)
        run: cargo clippy --locked -p hp2-engine --features renderer-wgpu --all-targets -- -D warnings

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make cmake ninja-build pkg-config \
            git python3 libarchive-tools libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libpulse-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev \
            libgtk-3-dev xvfb

      - name: Configure
        run: cmake --preset linux-x64 -DHP2_SHARED_TEST_CARGO_CACHE=ON

      - name: Agent and required-test contracts
        env:
          HP2_ARTIFACT_DIR: ${{ github.workspace }}/out/linux-x64/Testing/HP2/agent_ci/Artifacts
        run: |
          set -euo pipefail
          mkdir -p "$HP2_ARTIFACT_DIR"
          ctest --preset linux-x64 --show-only=json-v1 > "$HP2_ARTIFACT_DIR/ctest.json"
          python3 -B Build/check_agent_contracts.py \
            --ctest-json "$HP2_ARTIFACT_DIR/ctest.json" \
            --require-test agent_contracts \
            --require-test agent_navigation_contracts \
            --require-test native_free_game \
            --require-test native_free_ucc \
            --require-test native_free_import \
            --require-test cargo_test_cache_contracts \
            --require-test fractal_ice_alias_contracts \
            --require-test file_hash_contracts \
            --require-label data-none

      - name: Build verification binaries
        run: cmake --build --preset linux-x64 --target hp2_verification_binaries

      - name: Test (data-none profile)
        run: xvfb-run -a ctest --preset linux-x64 --no-tests=error -L data-none --output-on-failure

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Rust workspace tests
        env:
          HP2_ARTIFACT_DIR: ${{ github.workspace }}/out/linux-arm64/Testing/HP2/workspace_cargo/Artifacts
        run: |
          set -euo pipefail
          mkdir -p "$HP2_ARTIFACT_DIR"/{Home,Tmp,Config,Cache,Data}
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$HP2_ARTIFACT_DIR/Home" TMPDIR="$HP2_ARTIFACT_DIR/Tmp"
          export XDG_CONFIG_HOME="$HP2_ARTIFACT_DIR/Config"
          export XDG_CACHE_HOME="$HP2_ARTIFACT_DIR/Cache"
          export XDG_DATA_HOME="$HP2_ARTIFACT_DIR/Data"
          export LC_ALL=C TZ=UTC HP2_TEST_NAME=workspace_cargo
          exec > >(tee "$HP2_ARTIFACT_DIR/workspace.log") 2>&1
          cargo test --locked --workspace

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust clippy (renderer-wgpu feature)
        run: cargo clippy --locked -p hp2-engine --features renderer-wgpu --all-targets -- -D warnings

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make cmake ninja-build pkg-config \
            git python3 libarchive-tools libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libpulse-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev \
            libgtk-3-dev xvfb

      - name: Configure
        run: cmake --preset linux-arm64 -DHP2_SHARED_TEST_CARGO_CACHE=ON

      - name: Agent and required-test contracts
        env:
          HP2_ARTIFACT_DIR: ${{ github.workspace }}/out/linux-arm64/Testing/HP2/agent_ci/Artifacts
        run: |
          set -euo pipefail
          mkdir -p "$HP2_ARTIFACT_DIR"
          ctest --preset linux-arm64 --show-only=json-v1 > "$HP2_ARTIFACT_DIR/ctest.json"
          python3 -B Build/check_agent_contracts.py \
            --ctest-json "$HP2_ARTIFACT_DIR/ctest.json" \
            --require-test agent_contracts \
            --require-test agent_navigation_contracts \
            --require-test native_free_game \
            --require-test native_free_ucc \
            --require-test native_free_import \
            --require-test cargo_test_cache_contracts \
            --require-test fractal_ice_alias_contracts \
            --require-test file_hash_contracts \
            --require-label data-none

      - name: Build verification binaries
        run: cmake --build --preset linux-arm64 --target hp2_verification_binaries

      - name: Test (data-none profile)
        run: xvfb-run -a ctest --preset linux-arm64 --no-tests=error -L data-none --output-on-failure

  cask:
    # The tap is this repository, so a broken cask blocks every install
    # command in the README. Exercise the exact path the README documents,
    # without installing: tap the checkout, trust it, load the cask.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The tap name must match the repository name, or Homebrew clones into
      # homebrew-<name> and never sees this repo's Casks/ directory. Tapping
      # the checkout by URL is what a user does, and it exercises the same
      # resolution without publishing anything.
      - name: Validate cask
        run: |
          set -euo pipefail
          brew tap cefege/hp2 "file://$PWD"
          brew trust cefege/hp2
          brew readall cefege/hp2
          brew info --cask cefege/hp2/harry-potter-2

  web:
    # Browser build: pinned emsdk from ThirdParty/sources.json, then the
    # data-none smoke (cross-origin isolation + wasm64 module instantiation
    # in headless Chrome). No game data exists on the runner, so the
    # data-prototype boot smoke is not registered here; see
    # Docs/BEHAVIOR_MATRIX.md for what each data profile covers.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Rust has no wasm64-emscripten target, so the browser build checks
          # out the frozen pure-C++ tag until the web build returns.
          ref: web-cpp-freeze

      # The toolchain is not a repo submodule or an action: it is fetched at
      # the exact tag recorded in ThirdParty/sources.json, so the version
      # CI uses is the version the tree claims to be verified against.
      - name: Install pinned emsdk
        run: |
          set -euo pipefail
          tag=$(python3 -c "import json;print(next(s['tag'] for s in json.load(open('ThirdParty/sources.json'))['sources'] if s['name']=='emsdk'))")
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout "$tag"
          "$RUNNER_TEMP/emsdk/emsdk" install "$tag"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$tag"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Configure
        run: source "$EMSDK/emsdk_env.sh" && cmake --preset web-wasm64

      - name: Build
        run: source "$EMSDK/emsdk_env.sh" && cmake --build --preset web-wasm64

      - name: Test (data-none profile)
        run: source "$EMSDK/emsdk_env.sh" && ctest --preset web-wasm64 -L data-none --output-on-failure
