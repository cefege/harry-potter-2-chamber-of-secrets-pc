[package]
name = "hp2-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "hp2_game_rust"
path = "src/main.rs"

[dependencies]
hp2-abi.workspace = true
hp2-core.workspace = true
hp2-engine = { workspace = true, features = ["sdl", "openal", "renderer-wgpu", "text-coretext"] }
hp2-launcher.workspace = true
hp2-platform = { workspace = true, features = ["sdl"] }
hp2-wgpu = { workspace = true, features = ["sdl"] }
hp2-bootstrap-paths.workspace = true
libc.workspace = true
